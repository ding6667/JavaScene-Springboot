spring:
  profiles:
    active: dev
  application:
    name: dialogue-service
  config:
    import:
      - optional:nacos:common.yaml
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      config:
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:}
  ai:
    openai:
      base-url: "https://api.hcnsec.cn"
      chat:
        options:
          model: "auto"
          frequency-penalty: 0.0
          presence-penalty: 0.0
          max-tokens: 1000
          temperature: 0.7
    vectorstore:
      milvus:
        client:
          host: "localhost"
          port: 19530
          username: "root"
          password: "milvus"
        databaseName: "default"
        embeddingDimension: 1024
        indexType: IVF_FLAT
        metricType: COSINE
        collectionNames:
          studentResult: "student_result"
          intention: "intention"
    dashscope:
      embedding:
        enabled: true
        options:
          dimensions: 1024
          model: "text-embedding-v3"

# 免鉴权路径（Ant 风格，逗号分隔）；common-security 的默认值是 /api/user/auth/**
com:
  amlve:
    security:
      exclude-paths: ""

spring:
  profiles:
    active: dev
  application:
    name: "core"
  servlet:
    multipart:
      # Spring Boot 默认单文件仅 1MB，教材 PDF/docx 很容易超，请求会在进控制器前被解析层拒绝，
      # 既没有业务日志也没有上传留痕——九月"byfile 上传失败"的疑似根因，故显式放宽
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
  ai:
    openai:
      base-url: "https://api.hcnsec.cn"
      chat:
        options:
          model: "auto"
          frequency-penalty: 0.0
          presence-penalty: 0.0
          max-tokens: 1000
          temperature: 0.7
      api-key: "sk-burTbOlnhm9L1KC12EPSQciQlFkQIfL50hAZNKS2Bh9SG3PY"

    vectorstore:
      milvus:
        client:
          host: "localhost"
          port: 19530
          username: "root"
          password: "milvus"
        databaseName: "default"
        embeddingDimension: 1024
        indexType: IVF_FLAT
        metricType: COSINE
        collectionNames:
          studentResult: "student_result"
          intention: "intention"
    dashscope:
      embedding:
        enabled: true
        options:
          dimensions: 1024
          model: "text-embedding-v3"
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 若无密码则留空
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
logging:
  level:
    com.amlve: debug
    reactor.netty.http.client: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
temp:
  commonFile: "${user.dir}/temp/commonFile"
  unzip: "${user.dir}/temp/unzip"
  zip: "${user.dir}/temp/zip"
  expire_time: 7 # 临时文件过期时间，7天
python:
  script:
    md_to_docx_path: "${user.dir}/common/src/main/java/com/amlve/common/PyScript/md_to_docx.py"
    docx_to_md_path: "${user.dir}/common/src/main/java/com/amlve/common/PyScript/docx_to_md.py"
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler # 默认枚举类型处理类
  global-config:
    db-config:
      logic-delete-field: deleted
  type-aliases-package: com.amlve.common.Entities.TableEnt
  mapper-locations: classpath*:mapper/**/*.xml
dify:
  read-timeout: 120                       # 读取超时（秒）
  connect-timeout: 10                     # 连接超时（秒）
jwt:
  expiration: 86400000 # 24小时过期


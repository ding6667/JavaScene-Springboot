# Nacos 共享配置：上传到 Nacos 时使用 Data ID = common.yaml，Group = DEFAULT_GROUP
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 10000
            # 智能体链路（判分/出题/备课）走 Dify 时单次要跑几分钟，
            # 默认 60s 读超时会让调用方先报错，这里对齐 dify.read-timeout
            read-timeout: 600000
logging:
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
  mapper-locations: classpath*:mapper/**/*.xml

jwt:
  expiration: 86400000

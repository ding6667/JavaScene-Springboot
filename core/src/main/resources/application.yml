spring:
  profiles:
    active: dev
  application:
    name: "core"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    deepseek:
      base-url: https://api.deepseek.com/
      chat:
        options:
          model: "deepseek-3.5"
          frequency-penalty: 0.0
          presence-penalty: 0.0
          max-tokens: 1000
          temperature: 0.7
    vectorstore:
      milvus:
        client:
          host: "localhost"
          port: 19530
          username: "root"
          password: "milvus"
        databaseName: "default"
        collectionName: "javascene"
        embeddingDimension: 1024
        indexType: IVF_FLAT
        metricType: COSINE
    dashscope:
      embedding:
        enabled: true
        options:
          dimensions: 1024
          model: "text-embedding-v3"
logging:
  level:
    com.amlve: debug
    reactor.netty.http.client: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
temp:
  commonFile: "${user.dir}/temp/commonFile"
  unzip: "${user.dir}/temp/unzip"
  zip: "${user.dir}/temp/zip"
  expire_time: 7 # 临时文件过期时间，7天
python:
  script:
    md_to_docx_path: "${user.dir}/common/src/main/java/com/amlve/common/PyScript/md_to_docx.py"
    docx_to_md_path: "${user.dir}/common/src/main/java/com/amlve/common/PyScript/docx_to_md.py"
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler # 默认枚举类型处理类
  global-config:
    db-config:
      logic-delete-field: deleted
  type-aliases-package: com.amlve.common.Entities.TableEnt
  mapper-locations: classpath*:mapper/**/*.xml
dify:
  connect-timeout: 10                     # 连接超时（秒）
  read-timeout: 120                       # 读取超时（秒）
jwt:
  secret: "abcdefghabcdefghabcdefgh12345678"

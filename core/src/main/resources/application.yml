spring:
  profiles:
    active: dev
  application:
    name: "core"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
logging:
  level:
    com.amlve: debug
    reactor.netty.http.client: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
temp:
  word: "./temp/word"
  excel: "./temp/excel"
  zip: "./temp/zip"
  expire_time: 7 # 临时文件过期时间，7天
python:
  script:
    md_to_docx_path: "./PyScript/md_to_docx.py"
    docx_to_md_path: "./PyScript/docx_to_md.py"
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
  type-aliases-package: com.amlve.common.Entities.TableEnt
  mapper-locations: classpath*:mapper/**/*.xml
dify:
  connect-timeout: 10                     # 连接超时（秒）
  read-timeout: 120                       # 读取超时（秒）

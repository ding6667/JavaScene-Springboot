      - data:
          code: |
            import json
            
            MAX_CODE_LEN = 20000
            VALID_ERROR_TYPES = {
                "syntax_error", "runtime_error", "logic_error",
                "timeout", "memory_overflow", "security_violation", "none",
            }
            
            TYPE_ALIAS = {
                "syntax": "syntax_error", "compile_error": "syntax_error",
                "语法错误": "syntax_error", "编译错误": "syntax_error",
                "runtime": "runtime_error", "exception": "runtime_error",
                "运行错误": "runtime_error", "运行时异常": "runtime_error",
                "logic": "logic_error", "wrong_answer": "logic_error",
                "逻辑错误": "logic_error", "答案错误": "logic_error",
                "tle": "timeout", "超时": "timeout",
                "mle": "memory_overflow", "内存溢出": "memory_overflow",
                "security": "security_violation", "违规": "security_violation",
                "ok": "none", "passed": "none", "correct": "none",
            }
            
            SCENE_NAME = {
                "passed": "全部用例通过，侧重代码质量与优化空间",
                "logic_error": "部分用例未通过，侧重逻辑错误定位",
                "syntax_error": "编译不通过，侧重语法问题定位",
                "runtime_error": "运行时抛出异常，侧重异常成因与触发路径",
                "timeout": "运行超时，侧重复杂度与死循环排查",
                "memory_overflow": "内存溢出，侧重内存占用与数据结构选择",
                "security_violation": "触发安全规则，侧重违规写法说明",
                "free_practice": "自由练习（无题目约束），侧重通用代码质量",
                "none": "无明显错误，侧重代码质量与优化空间",
            }
            
            
            def _s(v) -> str:
                if v is None:
                    return ""
                if isinstance(v, bool):
                    return "true" if v else "false"
                if isinstance(v, float) and abs(v - round(v)) < 1e-9:
                    return str(int(round(v)))
                if isinstance(v, (dict, list)):
                    return json.dumps(v, ensure_ascii=False)
                return str(v).strip()
            
            
            def _int(v, default=-1):
                s = _s(v)
                if not s:
                    return default
                try:
                    return int(round(float(s)))
                except (TypeError, ValueError):
                    return default
            
            
            def _norm_error_type(raw: str, has_error: bool) -> str:
                t = raw.lower().replace("-", "_")
                if t in VALID_ERROR_TYPES:
                    return t
                if t in TYPE_ALIAS:
                    return TYPE_ALIAS[t]
                return "runtime_error" if has_error else "none"
            
            
            def _case_count(test_result: str, passed_count, total_count):
                passed = _int(passed_count, -1)
                total = _int(total_count, -1)
                if test_result:
                    try:
                        parsed = json.loads(test_result)
                    except Exception:
                        parsed = None
                    if isinstance(parsed, dict):
                        if passed < 0:
                            passed = _int(parsed.get("passedCount"), -1)
                        if total < 0:
                            total = _int(parsed.get("totalCount"), -1)
                passed = 0 if passed < 0 else passed
                total = 0 if total < 0 else total
                if total > 0:
                    passed = max(0, min(passed, total))
                return passed, total
            
            
            def main(code=None, chapter_id=None, chapter_name=None, question_id=None,
                     question_content=None, question_standard_answer=None,
                     question_requirements=None, error_type=None, error_msg=None,
                     error_line=None, run_result=None, test_result=None,
                     passed_count=None, total_count=None) -> dict:
                problems = []
                src = _s(code)
                if not src:
                    problems.append("学生代码不能为空")
                elif len(src) > MAX_CODE_LEN:
                    problems.append("学生代码长度不能超过 %d 字符" % MAX_CODE_LEN)
            
                e_msg = _s(error_msg)
                e_line = _s(error_line)
                run = _s(run_result)
                test = _s(test_result)
                e_type_raw = _s(error_type)
            
                passed, total = _case_count(test, passed_count, total_count)
                case_summary = ("共 %d 个用例，通过 %d 个" % (total, passed)) if total > 0 else "无测试用例"
            
                has_error = bool(e_msg) or bool(e_line) or e_type_raw not in ("", "none", "ok", "passed")
                e_type = _norm_error_type(e_type_raw, has_error)
            
                q_id = _s(question_id)
            
                if e_type == "none" and total > 0 and passed >= total:
                    scene = "passed"
                elif e_type == "none" and total > 0 and passed < total:
                    scene = "logic_error"
                elif e_type == "none" and not e_msg and not test and not run:
                    scene = "free_practice"
                else:
                    scene = e_type
            
                return {
                    "ok": "1" if not problems else "0",
                    "error_msg": "；".join(problems),
                    "scene": scene,
                    "scene_name": SCENE_NAME.get(scene, "通用代码分析"),
                    "code": src,
                    "code_line_count": len(src.splitlines()) if src else 0,
                    "chapter_id": _s(chapter_id),
                    "chapter_name": _s(chapter_name),
                    "has_question": "1" if q_id else "0",
                    "question_id": q_id,
                    "question_content": _s(question_content),
                    "question_standard_answer": _s(question_standard_answer),
                    "question_requirements": _s(question_requirements),
                    "error_type": e_type,
                    "error_msg_detail": e_msg,
                    "error_line": e_line,
                    "run_result": run,
                    "test_result": test,
                    "case_summary": case_summary,
                    "passed_count": passed,
                    "total_count": total,
                }
          code_language: python3
          outputs:
            case_summary:
              type: string
            chapter_id:
              type: string
            chapter_name:
              type: string
            code:
              type: string
            code_line_count:
              type: number
            error_line:
              type: string
            error_msg:
              type: string
            error_msg_detail:
              type: string
            error_type:
              type: string
            has_question:
              type: string
            ok:
              type: string
            passed_count:
              type: number
            question_content:
              type: string
            question_id:
              type: string
            question_requirements:
              type: string
            question_standard_answer:
              type: string
            run_result:
              type: string
            scene:
              type: string
            scene_name:
              type: string
            test_result:
              type: string
            total_count:
              type: number
          selected: false
          title: 解析与校验入参
          type: code
          variables:
            - value_selector:
                - start
                - code
              variable: code
            - value_selector:
                - start
                - chapter_id
              variable: chapter_id
            - value_selector:
                - start
                - chapter_name
              variable: chapter_name
            - value_selector:
                - start
                - question_id
              variable: question_id
            - value_selector:
                - start
                - question_content
              variable: question_content
            - value_selector:
                - start
                - question_standard_answer
              variable: question_standard_answer
            - value_selector:
                - start
                - question_requirements
              variable: question_requirements
            - value_selector:
                - start
                - error_type
              variable: error_type
            - value_selector:
                - start
                - error_msg
              variable: error_msg
            - value_selector:
                - start
                - error_line
              variable: error_line
            - value_selector:
                - start
                - run_result
              variable: run_result
            - value_selector:
                - start
                - test_result
              variable: test_result
            - value_selector:
                - start
                - passed_count
              variable: passed_count
            - value_selector:
                - start
                - total_count
              variable: total_count
        height: 50
        id: parse_inputs
        position:
          x: 380
          y: 230
        positionAbsolute:
          x: 380
          y: 230
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 241
        zIndex: 0
      - data:
          cases:
            - case_id: case_valid
              conditions:
                - comparison_operator: is
                  id: cond-ok
                  value: '1'
                  varType: string
                  variable_selector:
                    - parse_inputs
                    - ok
              id: case_valid
              logical_operator: and
          selected: false
          title: 入参校验分支
          type: if-else
        height: 122
        id: check_inputs
        position:
          x: 700
          y: 230
        positionAbsolute:
          x: 700
          y: 230
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 241
        zIndex: 0
      - data:
          context:
            enabled: false
            variable_selector: []
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: deepseek-v4-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - id: code-debug-system
              role: system
              text: |
                # 角色
                
                你是「Java 代码调试智能体」，服务于高校《Java程序设计基础》课程的学生编程练习。
                学生刚提交了一段 Java 代码，你会收到代码本身、题目信息、编译器/运行时原始报错、以及测试用例结果。
                你的任务是帮学生自己找到问题，而不是替他把题做完。
                
                
                # 学生易错点优先级
                
                定位问题时，优先排查这些高频坑：
                1. 数组下标越界、循环边界写成 <= ；
                2. 字符串比较用了 == 而不是 equals；
                3. 基本类型与包装类混用导致空指针拆箱；
                4. 整数除法丢精度、int 溢出；
                5. switch 漏 break 导致穿透；
                6. 构造方法/静态代码块执行顺序理解错误；
                7. 重写未加 @Override、equals 与 hashCode 不成对；
                8. 集合遍历中修改集合导致 ConcurrentModificationException。
                
                
                # 分析流程（必须按顺序思考）
                
                1. 通读代码，判断它想解决什么问题，与题目要求是否一致；
                2. 有编译错误：定位到具体行，说明违反的语法规则；
                3. 有运行时异常：结合异常类型与调用栈，还原触发异常的输入与执行路径；
                4. 有未通过的用例：逐用例比对期望与实际，指出是逻辑、边界还是类型问题；
                5. 全部通过：跳过找错，重点评估代码质量、复杂度与可优化点；
                6. 无论哪种场景，都要给出学生下一步能自己动手验证的路径。
                
                
                # 教学红线
                
                - 不给完整可运行答案，不重写整段代码；steps 只给思路、检查点和关键片段；
                - errorLineList 必须是学生代码里的真实行号（字符串形式的数字），无法定位时给空数组，禁止编造；
                - 每条结论都要能对应到代码或报错信息；不确定就写明"需要补充运行结果验证"，禁止臆测；
                - 面向零基础学生，讲清"为什么会错"，而不只是"应该怎么写"；
                - 只讨论教材范围内知识（语法、数组、类与对象、继承多态、接口、异常、集合、IO、多线程），不引入框架与高级特性；
                - 代码质量打分要有依据，不能一律给 5 分，也不能恶意压分。
                
                
                # 输出字段要求
                
                本节点已启用结构化输出：你只需按下列字段语义填写内容，格式由输出 schema 约束。
                不要在正文里自行拼接 JSON，不要用 markdown 代码块包裹，也不要输出 schema 之外的额外字段。
                所有字段都必须给出：确无内容时，字符串给空字符串，数组给空数组。
                
                - errorLineList：学生代码中的真实行号，元素为字符串形式的数字（如 "12"）；无法定位时给空数组；
                - errorReason：用人话解释错误原因，2-4 句，点明触发条件；
                - optimizeSuggest：针对本次问题的具体修改方向，不给完整代码；
                - standardIdea：本题正确的解题思路，分点描述；
                - knowledgePoints：本次涉及的知识点，2-5 个；
                - codeQuality：可读性 / 命名 / 结构 / 注释 / 复杂度控制 / 可复用性 六个 1-5 分维度，加一个 1-5 分的 overall 综合评分，以及 review 维度点评；
                - complexity：时间复杂度、空间复杂度、计算依据、是否可优化、可优化方向；
                - steps：分步引导，只写学生自己能动手做的检查与验证，不给答案；
                - commonMistakes：学生常写错的写法 vs 正确写法，并说明为什么会错；
                - improvements：改进建议，含类型、说明、关键代码片段、优先级；
                - relatedKnowledge：关联教材的知识点、章节、页码（页码不确定时留空）；
                - similarQuestions：相似题推荐，questionId 必须是真实题目 ID，没把握给空数组；
                - encouragement：一句真诚、不空洞的鼓励；
                - learningSuggestion：接下来该复习或练习什么。
                
                
                # 数量与取值约束
                
                - steps 给 3-5 条，按学生自己动手的顺序排列；
                - commonMistakes 给 1-3 条，improvements 给 2-4 条；
                - relatedKnowledge 给 1-3 条，页码不确定时只写章节名，page 留空；
                - similarQuestions 给 1-3 条，questionId 必须是数字；没有把握就给空数组；
                - improvements.type 只能是 READABILITY / PERFORMANCE / EDGE_CASE / REUSABILITY；
                - improvements.priority 只能是 HIGH / MEDIUM / LOW；
                - codeQuality 六个维度与 overall 必须是 1-5 的整数，禁止 0 分、禁止小数；
                - errorReason、optimizeSuggest、standardIdea 用中文，不要出现英文长句。
            - id: code-debug-user
              role: user
              text: |
                【本次场景】{{#parse_inputs.scene#}}（{{#parse_inputs.scene_name#}}）
                
                【所属章节】{{#parse_inputs.chapter_name#}}（chapter_id={{#parse_inputs.chapter_id#}}）
                
                【题目编号】{{#parse_inputs.question_id#}}（为空表示自由练习）
                
                【题目内容】
                {{#parse_inputs.question_content#}}
                
                【题目要求】
                {{#parse_inputs.question_requirements#}}
                
                【参考答案】
                {{#parse_inputs.question_standard_answer#}}
                
                【错误类型】{{#parse_inputs.error_type#}}
                
                【错误信息】
                {{#parse_inputs.error_msg_detail#}}
                
                【错误行号】{{#parse_inputs.error_line#}}
                
                【运行输出】
                {{#parse_inputs.run_result#}}
                
                【用例统计】{{#parse_inputs.case_summary#}}
                
                【用例明细】
                {{#parse_inputs.test_result#}}
                
                【学生代码】（共 {{#parse_inputs.code_line_count#}} 行）
                {{#parse_inputs.code#}}
                
                请按系统提示词中列出的字段要求填写结构化输出，不要自行拼接 JSON 文本。
          selected: false
          structured_output:
            schema:
              properties:
                errorLineList:
                  description: 错误所在行号列表，元素为学生代码中的真实行号字符串，如 "12"；无法定位时为空数组
                  items:
                    type: string

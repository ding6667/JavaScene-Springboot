      - data:
          code: |
            import json
            
            MAX_LIST = 8
            QUALITY_KEYS = ["readability", "naming", "structure", "comment",
                            "complexityControl", "reusability", "overall"]
            IMPROVE_TYPES = {"READABILITY", "PERFORMANCE", "EDGE_CASE", "REUSABILITY"}
            PRIORITIES = {"HIGH", "MEDIUM", "LOW"}
            DEFAULT_ENCOURAGEMENT = "代码能跑通是第一步，能写清楚才是真本事，继续加油。"
            
            
            def _s(v) -> str:
                if v is None:
                    return ""
                if isinstance(v, (dict, list)):
                    return json.dumps(v, ensure_ascii=False)
                return str(v).strip()
            
            
            def _safe_int(v):
                try:
                    return int(round(float(_s(v))))
                except (TypeError, ValueError):
                    return None
            
            
            def _load(raw) -> dict:
                """LLM 已启用结构化输出，正常入参就是 dict；仍兼容 JSON 字符串、```json 包裹与 Dify 响应包裹"""
                if isinstance(raw, dict):
                    return raw
                text = _s(raw)
                if not text:
                    return {}
                start = text.find("{")
                end = text.rfind("}")
                if start < 0 or end <= start:
                    return {}
                try:
                    data = json.loads(text[start:end + 1])
                except Exception:
                    return {}
                if not isinstance(data, dict):
                    return {}
                if isinstance(data.get("data"), dict):
                    outputs = data["data"].get("outputs")
                    if isinstance(outputs, dict):
                        return outputs
                if isinstance(data.get("outputs"), dict):
                    return data["outputs"]
                return data
            
            
            def _str_list(v, limit=MAX_LIST):
                out = []
                if isinstance(v, str):
                    v = [v]
                if not isinstance(v, list):
                    return out
                for item in v:
                    s = _s(item)
                    if s and s not in out:
                        out.append(s)
                    if len(out) >= limit:
                        break
                return out
            
            
            def _score(v):
                n = _safe_int(v)
                if n is None:
                    return None
                return max(1, min(5, n))
            
            
            def _quality(v) -> dict:
                if not isinstance(v, dict):
                    return {}
                q = {}
                for key in QUALITY_KEYS:
                    if key == "overall":
                        continue
                    val = _score(v.get(key))
                    if val is not None:
                        q[key] = val
                comment_raw = v.get("comment")
                if isinstance(comment_raw, (int, float)) and not isinstance(comment_raw, bool):
                    q["comment"] = _score(comment_raw)
                review = _s(v.get("review"))
                if not review and isinstance(comment_raw, str):
                    review = comment_raw.strip()
                if review:
                    q["review"] = review
                overall = _score(v.get("overall"))
                if overall is None:
                    scores = [q[k] for k in q if k in QUALITY_KEYS and k != "overall"]
                    overall = int(round(sum(scores) / len(scores))) if scores else None
                if overall is not None:
                    q["overall"] = overall
                return q
            
            
            def _complexity(v) -> dict:
                if not isinstance(v, dict):
                    return {}
                c = {}
                for key in ("timeComplexity", "spaceComplexity", "analysis", "optimizeDirection"):
                    s = _s(v.get(key))
                    if s:
                        c[key] = s
                opt = v.get("optimizable")
                if isinstance(opt, bool):
                    c["optimizable"] = opt
                elif isinstance(opt, str):
                    c["optimizable"] = opt.strip().lower() in ("true", "1", "yes", "是", "可优化")
                return c
            
            
            def _steps(v):
                out = []
                if not isinstance(v, list):
                    return out
                for item in v:
                    if not isinstance(item, dict):
                        continue
                    title = _s(item.get("title"))
                    content = _s(item.get("content"))
                    if not title and not content:
                        continue
                    no = _safe_int(item.get("stepNo"))
                    out.append({
                        "stepNo": no if no and no > 0 else len(out) + 1,
                        "title": title,
                        "content": content,
                        "codeLocation": _s(item.get("codeLocation")),
                    })
                    if len(out) >= MAX_LIST:
                        break
                return out
            
            
            def _mistakes(v):
                out = []
                if not isinstance(v, list):
                    return out
                for item in v:
                    if not isinstance(item, dict):
                        continue
                    mistake = _s(item.get("mistake"))
                    correct = _s(item.get("correct"))
                    if not mistake and not correct:
                        continue
                    out.append({
                        "mistake": mistake,
                        "correct": correct,
                        "reason": _s(item.get("reason")),
                    })
                    if len(out) >= MAX_LIST:
                        break
                return out
            
            
            def _improvements(v):
                out = []
                if not isinstance(v, list):
                    return out
                for item in v:
                    if not isinstance(item, dict):
                        continue
                    desc = _s(item.get("description"))
                    if not desc:
                        continue
                    t = _s(item.get("type")).upper()
                    p = _s(item.get("priority")).upper()
                    out.append({
                        "type": t if t in IMPROVE_TYPES else "READABILITY",
                        "description": desc,
                        "example": _s(item.get("example")),
                        "priority": p if p in PRIORITIES else "MEDIUM",
                    })
                    if len(out) >= MAX_LIST:
                        break
                return out
            
            
            def _related(v):
                out = []
                if not isinstance(v, list):
                    return out
                for item in v:
                    if not isinstance(item, dict):
                        continue
                    point = _s(item.get("point"))
                    if not point:
                        continue
                    out.append({
                        "point": point,
                        "chapter": _s(item.get("chapter")),
                        "page": _s(item.get("page")),
                    })
                    if len(out) >= MAX_LIST:
                        break
                return out
            
            
            def _similar(v):
                out = []
                if not isinstance(v, list):
                    return out
                for item in v:
                    if not isinstance(item, dict):
                        continue
                    content = _s(item.get("content"))
                    qid = _safe_int(item.get("questionId"))
                    if not content or qid is None or qid <= 0:
                        continue
                    out.append({
                        "questionId": qid,
                        "content": content,
                        "reason": _s(item.get("reason")),
                    })
                    if len(out) >= 5:
                        break
                return out
            
            
            def main(payload=None, error_msg=None) -> dict:
                data = _load(payload)
                if not data:
                    msg = _s(error_msg) or "AI 未返回符合约定的结构化结果"
                    return {
                        "errorLineList": [],
                        "errorReason": "本次未能生成有效的代码分析结果：" + msg,
                        "optimizeSuggest": "请稍后重试；若持续失败，请联系教师检查智能体配置。",
                        "standardIdea": "",
                        "knowledgePoints": [],
                        "codeQuality": {},
                        "complexity": {},
                        "steps": [],
                        "commonMistakes": [],
                        "improvements": [],
                        "relatedKnowledge": [],
                        "similarQuestions": [],
                        "encouragement": DEFAULT_ENCOURAGEMENT,
                        "learningSuggestion": "",
                    }
                return {
                    "errorLineList": _str_list(data.get("errorLineList")),
                    "errorReason": _s(data.get("errorReason")),
                    "optimizeSuggest": _s(data.get("optimizeSuggest")),
                    "standardIdea": _s(data.get("standardIdea")),
                    "knowledgePoints": _str_list(data.get("knowledgePoints")),
                    "codeQuality": _quality(data.get("codeQuality")),
                    "complexity": _complexity(data.get("complexity")),
                    "steps": _steps(data.get("steps")),
                    "commonMistakes": _mistakes(data.get("commonMistakes")),
                    "improvements": _improvements(data.get("improvements")),
                    "relatedKnowledge": _related(data.get("relatedKnowledge")),
                    "similarQuestions": _similar(data.get("similarQuestions")),
                    "encouragement": _s(data.get("encouragement")) or DEFAULT_ENCOURAGEMENT,
                    "learningSuggestion": _s(data.get("learningSuggestion")),
                }
          code_language: python3
          outputs:
            codeQuality:
              type: object
            commonMistakes:
              type: array[object]
            complexity:
              type: object
            encouragement:
              type: string
            errorLineList:
              type: array[string]
            errorReason:
              type: string
            improvements:
              type: array[object]
            knowledgePoints:
              type: array[string]
            learningSuggestion:
              type: string
            optimizeSuggest:
              type: string
            relatedKnowledge:
              type: array[object]
            similarQuestions:
              type: array[object]
            standardIdea:
              type: string
            steps:
              type: array[object]
          selected: false
          title: 结果规整与校验
          type: code
          variables:
            - value_selector:
                - aggregate_raw
                - output
              value_type: object
              variable: payload
            - value_selector:
                - parse_inputs
                - error_msg
              variable: error_msg

        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: read-sys
          role: system
          text: '你是"Java 程序阅读题"自动批改引擎，服务于高校 Java 课程作业批改系统。下面是本次待批改题目的完整信息。


            本次批改的题目编号是 {{#parse_inputs.question_id#}}，所属章节为「{{#parse_inputs.chapter_name#}}」（章节编号
            {{#parse_inputs.chapter_id#}}），题目预先标注的考查知识点为：{{#parse_inputs.knowledge_points#}}。本题满分为
            {{#parse_inputs.full_score#}} 分。


            题目给出一段 Java 代码，要求学生写出它的运行结果。题目内容如下：


            {{#parse_inputs.question_content#}}


            上述代码的真实运行结果（即标准答案）是：


            {{#parse_inputs.standard_answer#}}


            学生提交的作答是：


            {{#parse_inputs.student_answer#}}


            # 任务

            1. 完全独立地逐行模拟执行代码，推导其真实输出（先推导、后比对，严禁先看学生答案再反推）；

            2. 将推导结果与上面的标准答案交叉校验：若两者矛盾，以你的推导为准，并在 analysis 中明确说明矛盾点；

            3. 将推导结果与学生答案严格比对，给出判定与得分。


            # 比对规则

            - 忽略行首行尾空白；多行输出按行逐行比对，行序必须一致；

            - 数值、引号、全角/半角标点等差异，按代码真实语义判定是否等价；

            - 学生多写、少写、错写任何一行都视为不完全正确。


            # 评分规则

            - 本题型只有两种结果：完全一致 → score = {{#parse_inputs.full_score#}}；否则 score = 0。严禁给部分分。


            # errors 规则

            - 答对时 errors = []；

            - 答错时给出 1 条记录：location 指出学生理解错误对应的代码位置或知识点；errorType 只能取 SYNTAX_ERROR
            / LOGIC_ERROR / CONCEPT_ERROR / FORMAT_ERROR / MISSING / OTHER 之一；errorDescription
            描述错在哪里；reason 解释导致该错误的常见原因；suggestion 给出针对性纠正建议。


            # analysis 要求（简体中文，Markdown，按以下结构）

            ## 判定结果

            （对/错，一行说明）

            ## 代码推导过程

            （逐步推导：关键变量变化、循环每一轮的状态、最终输出，必须具体到数值）

            ## 答案对比

            （正确输出 vs 学生答案，逐行指出异同）

            ## 易错点

            （本题最易出错的知识点）


            # 输出格式（严格遵守）

            只输出一个 JSON 对象，禁止输出 Markdown 代码块围栏、注释或任何额外文字。字段（全部必填）：

            - score: 整数，等于 0 或 {{#parse_inputs.full_score#}}

            - errors: 数组，规则见上

            - knowledge_points: 字符串，本题实际考查的知识点，逗号分隔（优先取上文给出的知识点，可少量补充）

            - analysis: 字符串，按上述 Markdown 结构

            - suggestion: 字符串，答对时为 ""；答错时给出 1-3 条与章节、知识点关联的复习建议'
        - id: read-user
          role: user
          text: 请批改上面这位学生的程序阅读题作答，严格按系统指令输出批改 JSON。
        selected: false
        structured_output:
          schema:
            properties:
              analysis:
                description: 批改分析，Markdown 格式
                type: string
              errors:
                description: 错误明细数组，答对时为空数组
                items:
                  properties:
                    errorDescription:
                      description: 描述错在哪里
                      type: string
                    errorType:
                      description: 错误类型，只能是 SYNTAX_ERROR、LOGIC_ERROR、CONCEPT_ERROR、FORMAT_ERROR、MISSING、OTHER
                        之一
                      type: string
                    location:
                      description: 错误对应的代码位置或知识点
                      type: string
                    reason:
                      description: 解释导致该错误的常见原因
                      type: string
                    suggestion:
                      description: 针对性纠正建议
                      type: string
                  required:
                  - location
                  - errorType
                  - errorDescription
                  - reason
                  - suggestion
                  type: object
                type: array
              knowledge_points:
                description: 本题实际考查的知识点，逗号分隔
                type: string
              score:
                description: 判定得分，完全正确时等于题目满分，否则为 0
                type: integer
              suggestion:
                description: 复习建议，答对时为空字符串
                type: string
            required:
            - score
            - errors
            - knowledge_points
            - analysis
            - suggestion
            type: object
        structured_output_enabled: true
        title: 批改·程序阅读题
        type: llm
        vision:
          enabled: false

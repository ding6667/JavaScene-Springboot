    - data:
        code: "import json\n\nVALID_ERROR_TYPES = {\"SYNTAX_ERROR\", \"LOGIC_ERROR\"\
          , \"CONCEPT_ERROR\",\n                     \"FORMAT_ERROR\", \"MISSING\"\
          , \"OTHER\"}\n\n\ndef _extract_obj(raw: dict) -> dict:\n    \"\"\"\n   \
          \ 从 LLM 输出对象中提取批改结果。\n    LLM 输出可能是：\n      1. 直接的批改结果 dict，如 {\"score\"\
          : ..., \"errors\": [...]}\n      2. 包了一层 {\"inputs\": {...}} 或 {\"data\"\
          : {\"outputs\": {...}}} 的 dict\n    \"\"\"\n    if not raw:\n        raise\
          \ ValueError(\"LLM 输出为空\")\n    if not isinstance(raw, dict):\n        raise\
          \ ValueError(\"LLM 输出不是 dict 类型\")\n\n    # 情况1：直接是批改结果\n    if \"score\"\
          \ in raw or \"errors\" in raw:\n        return raw\n\n    # 情况2：包了一层 inputs\n\
          \    if isinstance(raw.get(\"inputs\"), dict):\n        return raw[\"inputs\"\
          ]\n\n    # 情况3：Dify workflow 结构 {\"data\": {\"outputs\": {...}}}\n    data\
          \ = raw.get(\"data\")\n    if isinstance(data, dict):\n        outputs =\
          \ data.get(\"outputs\")\n        if isinstance(outputs, dict):\n       \
          \     return outputs\n        # data 本身就是结果\n        if \"score\" in data\
          \ or \"errors\" in data:\n            return data\n\n    # 情况4：包了一层 outputs\n\
          \    if isinstance(raw.get(\"outputs\"), dict):\n        return raw[\"outputs\"\
          ]\n\n    # 都不匹配，返回原对象让下游自己处理\n    return raw\n\n\ndef main(raw_data: dict,\
          \ question_type: str, full_score: float,\n         question_id: str) ->\
          \ dict:\n    try:\n        data = _extract_obj(raw_data)\n        if not\
          \ isinstance(data, dict):\n            raise ValueError(\"提取后的结果不是 dict\"\
          )\n    except Exception as e:\n        detail = [{\n            \"location\"\
          : \"LLM 输出\",\n            \"errorType\": \"OTHER\",\n            \"errorDescription\"\
          : \"批改模型输出解析失败: \" + str(e),\n            \"reason\": \"模型未按要求返回合法结构。\"\
          ,\n            \"suggestion\": \"请重试本次批改；若持续出现，请检查模型配置。\",\n        }]\n\
          \        result = {\n            \"score\": 0,\n            \"is_correct\"\
          : 0,\n            \"error_detail\": json.dumps({\"errors\": detail}, ensure_ascii=False),\n\
          \            \"knowledge_points\": \"\",\n            \"analysis\": (\"\
          ## 批改失败\\n\\n批改模型输出无法解析为约定格式，\"\n                         \"本次结果不可用。\\n\\\
          n- question_id: \" + (question_id or \"\")),\n            \"suggestion\"\
          : \"请重新发起批改。\",\n        }\n        result[\"outputs\"] = json.dumps(result,\
          \ ensure_ascii=False)\n        return result\n\n    # 满分处理\n    try:\n \
          \       fs = int(round(float(full_score or 0)))\n    except (TypeError,\
          \ ValueError):\n        fs = 0\n\n    # 分数处理\n    try:\n        score =\
          \ int(round(float(data.get(\"score\", 0))))\n    except (TypeError, ValueError):\n\
          \        score = 0\n\n    # 程序阅读题（type=4）用全对全错逻辑，其他题型允许部分得分\n    if str(question_type)\
          \ == \"4\":\n        score = fs if score >= fs else 0\n    else:\n     \
          \   score = max(0, min(score, fs))\n\n    is_correct = 1 if (fs > 0 and\
          \ score == fs) else 0\n\n    # 错误明细处理\n    errors = []\n    for e in (data.get(\"\
          errors\") or []):\n        if not isinstance(e, dict):\n            continue\n\
          \        et = e.get(\"errorType\")\n        errors.append({\n          \
          \  \"location\": str(e.get(\"location\") or \"未定位\"),\n            \"errorType\"\
          : et if et in VALID_ERROR_TYPES else \"OTHER\",\n            \"errorDescription\"\
          : str(e.get(\"errorDescription\") or \"\"),\n            \"reason\": str(e.get(\"\
          reason\") or \"\"),\n            \"suggestion\": str(e.get(\"suggestion\"\
          ) or \"\"),\n        })\n\n    # 知识点去重\n    kps = str(data.get(\"knowledge_points\"\
          ) or \"\").strip()\n    for sep in (\"；\", \"，\", \";\", \",\"):\n     \
          \   kps = kps.replace(sep, \",\")\n    seen = set()\n    deduped = []\n\
          \    for p in kps.split(\",\"):\n        p = p.strip()\n        if p and\
          \ p not in seen:\n            seen.add(p)\n            deduped.append(p)\n\
          \    kps = \",\".join(deduped)\n\n    analysis = str(data.get(\"analysis\"\
          ) or \"\")\n    suggestion = str(data.get(\"suggestion\") or \"\")\n\n \
          \   result = {\n        \"score\": score,\n        \"is_correct\": is_correct,\n\
          \        \"error_detail\": json.dumps({\"errors\": errors}, ensure_ascii=False),\n\
          \        \"knowledge_points\": kps,\n        \"analysis\": analysis,\n \
          \       \"suggestion\": \"\" if is_correct == 1 else suggestion,\n    }\n\
          \    result[\"outputs\"] = json.dumps(result, ensure_ascii=False)\n    return\
          \ result"
        code_language: python3
        outputs:
          analysis:
            type: string
          error_detail:
            type: string
          is_correct:
            type: number
          knowledge_points:
            type: string
          outputs:
            type: string
          score:
            type: number
          suggestion:
            type: string

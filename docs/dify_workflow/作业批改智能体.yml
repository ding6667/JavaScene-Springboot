            # 任务

            逐方法、逐逻辑分支审查学生代码，独立判断其是否满足题目要求。


            # 评分规则（四维）

            - 功能完整性（约占 50%）：是否实现题目要求的全部功能点；

            - 语法正确性（约占 20%）：能否通过编译，有无语法错误；

            - 逻辑合理性（约占 20%）：算法与控制流是否正确，边界条件、异常处理是否合理；

            - 代码规范性（约占 10%）：命名、注释、代码组织是否清晰。

            - 在 analysis 的"四维评分"表中写明每个维度的满分分配（四维满分之和 = {{#parse_inputs.full_score#}}）与得分；score
            = 四维得分之和（整数）。

            - 严禁仅因写法与参考实现不同而扣分；只要满足题目要求即应得分。

            - 缺少题目明确要求的输入校验、异常处理等，在功能完整性或逻辑合理性中扣分并在失分点中写明。


            # errors 规则

            - 学生代码的每个缺陷对应一条记录：location 精确到类/方法/行；errorType 只能取 SYNTAX_ERROR / LOGIC_ERROR
            / CONCEPT_ERROR / FORMAT_ERROR / MISSING / OTHER 之一；errorDescription、reason、suggestion
            具体填写；

            - 无缺陷（满分）时 errors = []。


            # analysis 要求（简体中文，Markdown，按以下结构）


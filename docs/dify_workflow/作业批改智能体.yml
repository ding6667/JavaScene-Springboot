    - data:
        code: "import json\n\nMAX_LEN = 30000\n\ndef _s(v) -> str:\n    if v is None:\n\
          \        return \"\"\n    if isinstance(v, float) and abs(v - round(v))\
          \ < 1e-9:\n        return str(int(round(v)))\n    return str(v).strip()\n\
          \ndef main(inputs) -> dict:\n    problems = []\n    raw = \"\" if inputs\
          \ is None else str(inputs).strip()\n    data = {}\n    parse_ok = True\n\
          \    if not raw:\n        parse_ok = False\n        problems.append(\"inputs\
          \ 不能为空\")\n    else:\n        try:\n            parsed = json.loads(raw)\n\
          \            if isinstance(parsed, str):\n                parsed = json.loads(parsed)\n\
          \            if isinstance(parsed, dict) and isinstance(parsed.get(\"inputs\"\
          ), (dict, str)):\n                inner = parsed.get(\"inputs\")\n     \
          \           parsed = json.loads(inner) if isinstance(inner, str) else inner\n\
          \            if not isinstance(parsed, dict):\n                parse_ok\
          \ = False\n                problems.append(\"inputs 必须是 JSON 对象（或含 inputs\
          \ 字段的 JSON 对象）\")\n            else:\n                data = parsed\n  \
          \      except Exception:\n            parse_ok = False\n            problems.append(\"\
          inputs 无法解析为合法 JSON 对象\")\n\n    q_id = _s(data.get(\"question_id\"))\n\
          \    q_type = _s(data.get(\"question_type\"))\n    content = _s(data.get(\"\
          question_content\"))\n    std = _s(data.get(\"standard_answer\"))\n    stu\
          \ = _s(data.get(\"student_answer\"))\n    fs_raw = _s(data.get(\"full_score\"\
          ))\n    ch_id = _s(data.get(\"chapter_id\"))\n    ch_name = _s(data.get(\"\
          chapter_name\"))\n    kps = _s(data.get(\"knowledge_points\"))\n    run_res\
          \ = _s(data.get(\"run_result\"))\n\n    if parse_ok:\n        if not q_id:\n\
          \            problems.append(\"question_id 不能为空\")\n        elif len(q_id)\
          \ > 64:\n            problems.append(\"question_id 长度不能超过64\")\n       \
          \ if q_type not in (\"4\", \"5\", \"6\"):\n            problems.append(\"\
          question_type 必须为 4(程序阅读)/5(程序改错)/6(编程题)，本工作流仅支持主观题\")\n        if not content:\n\
          \            problems.append(\"question_content 不能为空\")\n        elif len(content)\
          \ > MAX_LEN:\n            problems.append(\"question_content 长度不能超过30000\"\
          )\n        if not std:\n            problems.append(\"standard_answer 不能为空\"\
          )\n        elif len(std) > MAX_LEN:\n            problems.append(\"standard_answer\
          \ 长度不能超过30000\")\n        if not stu:\n            problems.append(\"student_answer\
          \ 不能为空\")\n        elif len(stu) > MAX_LEN:\n            problems.append(\"\
          student_answer 长度不能超过30000\")\n        if not ch_id:\n            problems.append(\"\
          chapter_id 不能为空\")\n        elif len(ch_id) > 64:\n            problems.append(\"\
          chapter_id 长度不能超过64\")\n\n        fs = 0\n        if not fs_raw:\n     \
          \       problems.append(\"full_score 不能为空\")\n        else:\n          \
          \  try:\n                fs_val = float(fs_raw)\n                if fs_val\
          \ <= 0 or fs_val > 1000:\n                    problems.append(\"full_score\
          \ 必须在 (0, 1000] 范围内\")\n                elif abs(fs_val - round(fs_val))\
          \ > 1e-9:\n                    problems.append(\"full_score 必须为整数\")\n \
          \               else:\n                    fs = int(round(fs_val))\n   \
          \         except ValueError:\n                problems.append(\"full_score\
          \ 必须为数字\")\n\n        if len(ch_name) > 200:\n            problems.append(\"\
          chapter_name 长度不能超过200\")\n        if len(kps) > 500:\n            problems.append(\"\
          knowledge_points 长度不能超过500\")\n        if len(run_res) > 10000:\n      \
          \      problems.append(\"run_result 长度不能超过10000\")\n    else:\n        fs\
          \ = 0\n\n    type_name = {\"4\": \"程序阅读题\", \"5\": \"程序改错题\", \"6\": \"\
          编程题\"}.get(q_type, \"未知题型\")\n    ok = \"1\" if not problems else \"0\"\n\
          \    error_msg = \"；\".join(problems)\n\n    return {\n        \"ok\": ok,\n\
          \        \"error_msg\": error_msg,\n        \"question_id\": q_id,\n   \
          \     \"question_type\": q_type,\n        \"question_type_name\": type_name,\n\
          \        \"question_content\": content,\n        \"standard_answer\": std,\n\
          \        \"student_answer\": stu,\n        \"full_score\": fs,\n       \
          \ \"chapter_id\": ch_id,\n        \"chapter_name\": ch_name,\n        \"\
          knowledge_points\": kps,\n        \"run_result\": run_res,\n    }"
        code_language: python3

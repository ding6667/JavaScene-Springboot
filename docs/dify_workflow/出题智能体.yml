    - data:
        code: "def main(point_name: str, point_count: str, docs: list) -> dict:\n\
          \    \"\"\"把单个知识点的题量与检索片段拼成一段上下文，交给 LLM 节点作为 context。\n\n    迭代出口从\"只透传检索结果\"\
          改为\"按知识点成块\"，让模型能看清\n    每个知识点计划出几道题、对应哪些教材片段。\n    \"\"\"\n    lines =\
          \ []\n    header = \"【知识点】\" + (point_name or \"未命名知识点\")\n    if point_count:\n\
          \        header = header + \"（本次计划出题 \" + str(point_count) + \" 道）\"\n \
          \   lines.append(header)\n\n    if not docs:\n        lines.append(\"（该知识点本次未检索到教材片段）\"\
          )\n    else:\n        for index, doc in enumerate(docs, 1):\n          \
          \  if isinstance(doc, dict):\n                title = doc.get(\"title\"\
          ) or \"\"\n                text = doc.get(\"content\") or doc.get(\"text\"\
          ) or \"\"\n            else:\n                title = \"\"\n           \
          \     text = str(doc)\n            block = \"[\" + str(index) + \"]\"\n\
          \            if title:\n                block = block + \" 《\" + str(title)\
          \ + \"》\"\n            lines.append(block)\n            lines.append(str(text))\n\
          \n    return {\"content\": \"\\n\".join(lines)}"
        code_language: python3
        isInIteration: true

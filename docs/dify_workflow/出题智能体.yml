app:
  description: '1. 知识点精准命题：根据章节重难点权重分配题目数量，重难点题量多、难度高。

    2. 难度分层生成：

    基础层：教材原题变式、概念记忆题；

    进阶层：知识点简单应用题；

    拔高层：多知识点综合题，贴合期末考核难度。

    3. 自动配套解析：每题生成教材对应知识点解析，不超纲、不超难。

    4. 支持自定义组卷：教师可指定章节、难度、题型自动组卷。

    '

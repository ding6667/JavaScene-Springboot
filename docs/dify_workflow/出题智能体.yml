    - data:
        code: "import json\n\n\ndef main(inputs: dict):\n    # 必填参数\n    chapter_id\
          \ = inputs.get(\"chapter_id\")\n    chapter_name = inputs.get(\"chapter_name\"\
          )\n    allocation_str = inputs.get(\"allocation\")\n    count = inputs.get(\"\
          count\")\n\n    # 选填参数，带默认值\n    difficulty = inputs.get(\"difficulty\"\
          , \"all\")\n    question_type = inputs.get(\"question_type\", \"all\")\n\
          \    user_instruction = inputs.get(\"user_instruction\", \"\")\n\n    #\
          \ allocation 是 JSON 字符串，解析成 list\n    allocation = json.loads(allocation_str)\
          \ if allocation_str else []\n\n    # 可选：简单校验\n    if chapter_id is None:\n\
          \        raise ValueError(\"chapter_id 不能为空\")\n    if allocation_str is\
          \ None:\n        raise ValueError(\"allocation 不能为空\")\n    if count is\
          \ None:\n        raise ValueError(\"count 不能为空\")\n\n    # 这里写你的业务逻辑，比如调用\
          \ QuestionAgentImpl\n    # ...\n\n    return {\n        \"chapter_id\":\
          \ chapter_id,\n        \"chapter_name\": chapter_name,\n        \"allocation\"\
          : allocation,\n        \"allocation_str\": allocation_str,\n        \"difficulty\"\
          : difficulty,\n        \"question_type\": question_type,\n        \"count\"\
          : count,\n        \"user_instruction\": user_instruction,\n    }"

    - data:
        code: "\nimport json\n\n\ndef main(difficulty: str) -> dict:\n    \"\"\"\n\
          \    从 Dify 传入的 difficulty JSON 字符串中提取字段\n    用于后续节点单独引用\n\n    :param difficulty:\
          \ JSON 字符串，结构对应 Java 的 DifficultyConfig\n    :return: 拆分后的字段\n    \"\"\"\
          \n    # 兜底：空字符串或 None\n    if not difficulty or not difficulty.strip():\n\
          \        return {\n            \"difficulty_code\": \"\",\n            \"\
          difficulty_name\": \"\",\n            \"difficulty_description\": \"\",\n\
          \            \"difficulty_example\": \"\",\n            \"cognitive_levels\"\
          : \"\"\n        }\n\n    try:\n        config = json.loads(difficulty)\n\
          \    except (json.JSONDecodeError, TypeError) as e:\n        # 解析失败时返回空，避免工作流崩溃\n\
          \        return {\n            \"difficulty_code\": \"\",\n            \"\
          difficulty_name\": \"\",\n            \"difficulty_description\": \"\",\n\
          \            \"difficulty_example\": \"\",\n            \"cognitive_levels\"\
          : \"\",\n            \"parse_error\": f\"difficulty 解析失败: {str(e)}\"\n \
          \       }\n\n    # 提取各字段（带默认值）\n    code = config.get(\"code\", \"\")\n\
          \    name = config.get(\"name\", \"\")\n    description = config.get(\"\
          description\", \"\")\n    example = config.get(\"example\", \"\")\n\n  \
          \  # cognitiveLevels 是列表，拼接为字符串供 LLM 阅读\n    cognitive_levels_list = config.get(\"\
          cognitiveLevels\", [])\n    if isinstance(cognitive_levels_list, list):\n\
          \        cognitive_levels = \"、\".join(str(item) for item in cognitive_levels_list)\n\
          \    else:\n        cognitive_levels = str(cognitive_levels_list)\n\n  \
          \  return {\n        \"difficulty_code\": code,\n        \"difficulty_name\"\
          : name,\n        \"difficulty_description\": description,\n        \"difficulty_example\"\
          : example,\n        \"cognitive_levels\": cognitive_levels\n    }"

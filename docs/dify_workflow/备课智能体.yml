    - data:
        code: "import json\nimport re\n\n_THINK_BLOCK = re.compile(r\"<think\\b[^>]*>.*?</think\\s*>\", re.S)\n_DIFY_BLOCK = re.compile(\n    r\"<!--\\s*dify-deepseek-reasoning\\s*-->.*?<!--\\s*/dify-deepseek-reasoning\\s*-->\",\n    re.S,\n)\n_RESIDUAL_TAGS = re.compile(\n    r\"</?think\\b[^>]*>|<!--\\s*/?dify-deepseek-reasoning\\s*-->\",\n    re.S,\n)\n\n\ndef _strip(text: str) -> str:\n    if not text:\n        return \"\"\n    text = _THINK_BLOCK.sub(\"\", text)\n    text = _DIFY_BLOCK.sub(\"\", text)\n    text = _RESIDUAL_TAGS.sub(\"\", text)\n    return text.strip()\n\n\ndef _json_obj(text: str) -> dict:\n    start = text.find(\"{\")\n    if start < 0:\n        return {}\n    try:\n        obj, _ = json.JSONDecoder().raw_decode(text[start:])\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n        end = text.rfind(\"}\")\n        if end <= start:\n            return {}\n        try:\n            obj = json.loads(text[start:end + 1])\n            return obj if isinstance(obj, dict) else {}\n        except Exception:\n            return {}\n\n\ndef _markdown(value: str) -> str:\n    text = _strip(value)\n    if not text:\n        return \"\"\n    data = _json_obj(text)\n    md = data.get(\"pptx_md\")\n    if isinstance(md, str) and md.strip():\n        return _strip(md)\n    return text\n\n\ndef main(draft_text: str, draft_struct: dict) -> dict:\n    md = \"\"\n    if isinstance(draft_struct, dict):\n        value = draft_struct.get(\"pptx_md\")\n        if isinstance(value, str):\n            md = _markdown(value)\n    if not md:\n        md = _markdown(draft_text)\n    return {\"draft_md\": md}\n"

    - data:
        code: "import json\nimport re\n\n_THINK_BLOCK = re.compile(r\"<think\\b[^>]*>.*?</think\\s*>\", re.S)\n_DIFY_BLOCK = re.compile(\n    r\"<!--\\s*dify-deepseek-reasoning\\s*-->.*?<!--\\s*/dify-deepseek-reasoning\\s*-->\",\n    re.S,\n)\n_RESIDUAL_TAGS = re.compile(\n    r\"</?think\\b[^>]*>|<!--\\s*/?dify-deepseek-reasoning\\s*-->\",\n    re.S,\n)\n\n\ndef _strip(text):\n    if not isinstance(text, str) or not text:\n        return \"\"\n    text = _THINK_BLOCK.sub(\"\", text)\n    text = _DIFY_BLOCK.sub(\"\", text)\n    text = _RESIDUAL_TAGS.sub(\"\", text)\n    return text.strip()\n\n\ndef _as_obj(value):\n    if isinstance(value, dict):\n        return value\n    if isinstance(value, str):\n        try:\n            data = json.loads(value or \"{}\")\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            return {}\n    return {}\n\n\ndef _json_obj(text):\n    text = _strip(text)\n    start = text.find(\"{\")\n    if start < 0:\n        return {}\n    try:\n        obj, _ = json.JSONDecoder().raw_decode(text[start:])\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n        end = text.rfind(\"}\")\n        if end <= start:\n            return {}\n        try:\n            obj = json.loads(text[start:end + 1])\n            return obj if isinstance(obj, dict) else {}\n        except Exception:\n            return {}\n\n\ndef _pick_pptx(struct_val, raw):\n    struct_val = _as_obj(struct_val)\n    md = struct_val.get(\"pptx_md\")\n    if isinstance(md, str) and md.strip():\n        return _strip(md)\n    text = _strip(raw)\n    if not text:\n        return \"\"\n    data = _json_obj(text)\n    md = data.get(\"pptx_md\")\n    if isinstance(md, str) and md.strip():\n        return _strip(md)\n    return text\n\n\ndef _pick_others(struct_val, raw):\n    result = {}\n    struct_val = _as_obj(struct_val)\n    for key in (\"lesson_plan\", \"key_points\", \"homework\", \"lab\"):\n        value = struct_val.get(key)\n        if isinstance(value, str) and value.strip():\n            result[key] = _strip(value)\n    if len(result) < 4:\n        data = _json_obj(raw)\n        for key in (\"lesson_plan\", \"key_points\", \"homework\", \"lab\"):\n            if key in result:\n                continue\n            value = data.get(key)\n            if isinstance(value, str) and value.strip():\n                result[key] = _strip(value)\n    return result\n\n\ndef _heading(page):\n    match = re.search(r\"(?m)^#{1,6}\\s+(.+)$\", page)\n    return match.group(1).strip() if match else \"\"\n\n\ndef _apply_ppt_cfg(md, cfg):\n    cfg = _as_obj(cfg)\n    if not md:\n        return md\n    pages = re.split(r\"(?m)^---\\s*$\", md)\n    kept = []\n    for page in pages:\n        heading = _heading(page)\n        if cfg.get(\"includeOutline\") == \"0\" and (\"本节课内容\" in heading or \"目录\" in heading):\n            continue\n        if cfg.get(\"includeSummary\") == \"0\" and (\"小结\" in heading or \"总结\" in heading):\n            continue\n        kept.append(page.strip())\n    if len(kept) == len(pages):\n        return md\n    sep = chr(10) * 2 + \"---\" + chr(10) * 2\n    return sep.join(kept).strip() + chr(10)\n\n\ndef main(pptx_struct, pptx_raw, others_struct, others_raw, switches_json: str, ppt_cfg) -> dict:\n    switches = _as_obj(switches_json)\n    pptx_md = _apply_ppt_cfg(_pick_pptx(pptx_struct, pptx_raw), ppt_cfg)\n    others = _pick_others(others_struct, others_raw)\n\n    # 校验：避免“静默截断”把正文丢掉\n    if switches.get(\"pptx\") == \"1\":\n        if not pptx_md:\n            raise ValueError(\"pptx 内容为空，检查 Dify 返回格式\")\n        if not pptx_md.lstrip().startswith((\"#\", \"<!--\", \"---\")):\n            raise ValueError(f\"pptx_md 开头不像 Markdown：{pptx_md[:80]!r}\")\n\n    def pick(key):\n        value = others.get(key, \"\")\n        return \"\" if value is None else str(value)\n\n    return {\n        \"output\": {\n            \"pptx_md\": pptx_md if switches.get(\"pptx\") == \"1\" else \"\",\n            \"lesson_plan\": pick(\"lesson_plan\") if switches.get(\"lesson_plan\") == \"1\" else \"\",\n            \"key_points\": pick(\"key_points\") if switches.get(\"key_points\") == \"1\" else \"\",\n            \"homework\": pick(\"homework\") if switches.get(\"homework\") == \"1\" else \"\",\n            \"lab\": pick(\"lab\") if switches.get(\"lab\") == \"1\" else \"\",\n        }\n    }\n"

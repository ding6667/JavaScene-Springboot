    - data:
        code: "import json\n\n\ndef _obj(value):\n    \"\"\"入参兼容 dict 与 JSON 字符串，异常时返回空字典\"\"\"\n    if isinstance(value, dict):\n        return value\n    if isinstance(value, str):\n        try:\n            data = json.loads(value)\n            return data if isinstance(data, dict) else {}\n        except Exception:\n            return {}\n    return {}\n\n\ndef _text(value):\n    \"\"\"统一转字符串：列表/字典序列化为 JSON，None -> 空串\"\"\"\n    if value is None:\n        return \"\"\n    if isinstance(value, str):\n        return value\n    return json.dumps(value, ensure_ascii=False)\n\n\ndef _list(value):\n    if isinstance(value, list):\n        return value\n    if isinstance(value, str):\n        try:\n            data = json.loads(value)\n            return data if isinstance(data, list) else []\n        except Exception:\n            return []\n    return []\n\n\ndef _flag(value, default=\"1\"):\n    if value is None or value == \"\":\n        return default\n    return str(value)\n\n\ndef _page_of(pages, name):\n    \"\"\"页码匹配：精确优先，其次双向包含，未命中返回空串\"\"\"\n    if name in pages:\n        return _text(pages.get(name))\n    for key, val in pages.items():\n        if key and name and (key in name or name in key):\n            return _text(val)\n    return \"\"\n\n\ndef _page_text(value):\n    \"\"\"页码统一为 P.xxx；教材页码可能是整数或已有前缀的字符串\"\"\"\n    if value is None or value == \"\":\n        return \"\"\n    text = _text(value).strip()\n    if not text:\n        return \"\"\n    upper = text.upper()\n    if upper.startswith(\"P\"):\n        return text\n    return \"P.\" + text\n\n\ndef main(settings: dict, reference: dict, ppt_config: dict,\n         lesson_plan_config: dict, homework_config: dict,\n         styleTokens: str) -> dict:\n    \"\"\"提取开关与素材、解析三个生成配置，并把素材重组为 PPT 页面素材包。\"\"\"\n\n    settings = _obj(settings)\n    reference = _obj(reference)\n    ppt_config = _obj(ppt_config)\n    lesson_plan_config = _obj(lesson_plan_config)\n    homework_config = _obj(homework_config)\n\n    # ---------- 五个生成开关 ----------\n    switches = {\n        \"pptx\": _flag(settings.get(\"pptx\"), \"0\"),\n        \"lesson_plan\": _flag(settings.get(\"lesson_plan\"), \"0\"),\n        \"homework\": _flag(settings.get(\"homework\"), \"0\"),\n        \"lab\": _flag(settings.get(\"lab\"), \"0\"),\n        \"key_points\": _flag(settings.get(\"key_points\"), \"0\"),\n    }\n\n    # ---------- 七类素材 ----------\n    material = {\n        \"chapter_summary\": _text(reference.get(\"chapter_summary\")),\n        \"concept_definitions\": _text(reference.get(\"concept_definitions\")),\n        \"code_examples\": _text(reference.get(\"code_examples\")),\n        \"common_mistakes\": _text(reference.get(\"common_mistakes\")),\n        \"page_references\": _text(reference.get(\"page_references\")),\n        \"exercises\": _text(reference.get(\"exercises\")),\n        \"lab_tasks\": _text(reference.get(\"lab_tasks\")),\n    }\n\n    # ---------- 三个生成配置（缺省兜底） ----------\n    ppt_cfg = {\n        \"structure\": _text(ppt_config.get(\"structure\")),\n        \"pageRange\": _text(ppt_config.get(\"pageRange\")) or \"10-14\",\n        \"includeOutline\": _flag(ppt_config.get(\"includeOutline\"), \"1\"),\n        \"includeSummary\": _flag(ppt_config.get(\"includeSummary\"), \"1\"),\n        \"codeBlockMax\": _flag(ppt_config.get(\"codeBlockMax\"), \"2\"),\n    }\n    lesson_cfg = {\n        \"courseType\": _text(lesson_plan_config.get(\"courseType\")) or \"new\",\n        \"duration\": _text(lesson_plan_config.get(\"duration\")) or \"45\",\n        \"detailLevel\": _text(lesson_plan_config.get(\"detailLevel\")) or \"medium\",\n        \"includeBoardDesign\": _flag(lesson_plan_config.get(\"includeBoardDesign\"), \"1\"),\n        \"includeExercise\": _flag(lesson_plan_config.get(\"includeExercise\"), \"1\"),\n    }\n    hw_cfg = {\n        \"questionCount\": _text(homework_config.get(\"questionCount\")) or \"5\",\n        \"difficultyDistribution\": _text(homework_config.get(\"difficultyDistribution\")) or \"2,2,1\",\n        \"questionBank\": _text(homework_config.get(\"questionBank\")),\n    }\n\n    # ---------- 视觉风格令牌（白名单，空对象表示未传） ----------\n    style = _obj(styleTokens)\n    allowed = [\"primaryColor\", \"backgroundColor\", \"textColor\", \"fontFamily\",\n               \"headingWeight\", \"codeBgColor\", \"styleDescription\"]\n    style_cfg = {k: _text(style.get(k)) for k in allowed if style.get(k)}\n\n    # ---------- PPT 页面素材包：按知识点分组，LLM 逐页填充 ----------\n    concepts = _list(material[\"concept_definitions\"])\n    codes = _list(material[\"code_examples\"])\n    mistakes = _list(material[\"common_mistakes\"])\n    pages = _obj(material[\"page_references\"])\n\n    pack = []\n    for i, concept in enumerate(concepts):\n        if not isinstance(concept, dict):\n            concept = {\"name\": concept}\n        name = _text(concept.get(\"name\")) or (\"知识点\" + str(i + 1))\n        code_item = codes[i] if i < len(codes) else {}\n        if not isinstance(code_item, dict):\n            code_item = {\"code\": code_item}\n        pack.append({\n            \"concept\": name,\n            \"definition\": _text(concept.get(\"definition\")),\n            \"example\": _text(concept.get(\"example\")),\n            \"code_title\": _text(code_item.get(\"title\")),\n            \"code\": _text(code_item.get(\"code\")),\n            \"page\": _page_text(concept.get(\"page\")) or _page_of(pages, name),\n            \"code_page\": _page_text(code_item.get(\"page\")),\n        })\n\n    # 随堂练习只取少量题目，避免整章习题（可能上百题）挤占 PPT 提示词体积\n    material_pack = {\n        \"chapter_summary\": material[\"chapter_summary\"],\n        \"knowledge_points\": pack,\n        \"extra_codes\": codes[len(concepts):],\n        \"common_mistakes\": mistakes,\n        \"page_references\": pages,\n        \"exercises\": _list(material[\"exercises\"])[:6],\n    }\n\n    return {\n        \"switches_json\": json.dumps(switches, ensure_ascii=False),\n        \"material_json\": json.dumps(material, ensure_ascii=False),\n        \"material_pack_json\": json.dumps(material_pack, ensure_ascii=False),\n        \"ppt_cfg_json\": json.dumps(ppt_cfg, ensure_ascii=False),\n        \"lesson_cfg_json\": json.dumps(lesson_cfg, ensure_ascii=False),\n        \"hw_cfg_json\": json.dumps(hw_cfg, ensure_ascii=False),\n        \"style_json\": json.dumps(style_cfg, ensure_ascii=False),\n    }"

# teach 模块集成测试专用配置（仅测试 classpath 生效，不影响运行时）
# 完整应用的数据源由 bootstrap 的 application-dev.yml 提供
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/javascene?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# PPT 临时文件目录（MarkdownToPptxUtil 读取）
temp:
  commonFile: ${java.io.tmpdir}/javascene_prepare_test

# marp2pptx 本地安装绝对路径（与 bootstrap application-dev.yml 保持一致）
prepare:
  marp-command: "C:\\Users\\31788\\AppData\\Roaming\\Python\\Python313\\Scripts\\marp2pptx.exe"

# Dify 配置：密钥通过环境变量 DIFY_PREPARE_API_KEY 注入真实密钥跑真实链路；
# 未设置时为空 → agent-prepare 走 Mock 兜底（单测默认路径）
dify:
  base-url: "http://localhost:8081/v1"
  prepare-api-key: "${DIFY_PREPARE_API_KEY:}"
